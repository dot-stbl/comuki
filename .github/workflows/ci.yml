# S14 — CI: GitHub Actions.
#
# Contract (see AGENTS.md):
# - Build gate  = `dotnet build comuki.slnx -c Debug` (warnings-as-errors,
#   analyzers, format gate — all enforced by Directory.Build.props, no extra flags).
# - Tests       = xUnit v3 on Microsoft Testing Platform: `dotnet run --project <csproj>`.
#   `dotnet test` cannot discover xUnit v3 — do not switch to it.
# - No docker image build here yet — the worker image arrives with S3.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-be:
    name: build backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore comuki.slnx

      - name: Build
        run: dotnet build comuki.slnx -c Debug --no-restore

  test-be:
    name: test backend (${{ matrix.project }})
    needs: build-be
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - tests/Comuki.Architecture.Tests
          - tests/unit/Comuki.Host.Translator.Unit.StreamJson
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # xUnit v3 = Microsoft Testing Platform: run the test project directly.
      # Fresh runner (build-be artifacts do not carry over) -> plain `dotnet run`
      # restores + builds the project graph, then runs.
      - name: Run tests
        run: dotnet run --project ${{ matrix.project }} -c Debug

  build-fe:
    name: build frontend (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dashboard is mid-migration: `lint` currently fails (eslint config references
    # rules whose plugins are not installed, e.g. jsx-a11y/anchor-is-valid,
    # @typescript-eslint/naming-convention — 46 errors). typecheck and vitest are
    # green. Non-blocking until the eslint config is fixed — then remove this line.
    continue-on-error: true
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bun.lock is not committed yet -> plain install, no --frozen-lockfile.
      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

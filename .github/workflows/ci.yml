# S14 — CI: GitHub Actions.
#
# Contract (see AGENTS.md):
# - Build gate  = `dotnet build comuki.slnx -c Debug` (warnings-as-errors,
#   analyzers, format gate — all enforced by Directory.Build.props, no extra flags).
# - Tests       = xUnit v3 on Microsoft Testing Platform: `dotnet run --project <csproj>`.
#   `dotnet test` cannot discover xUnit v3 — do not switch to it. Discovery +
#   run + CTRF-report parsing + report.json/report.md go through
#   `scripts/ci/dotnet-test.mjs` (see openspec/changes/add-agentic-test-contour/design.md),
#   the same script GitLab's deploy/hybrid/ci.yml calls, so both pipelines
#   agree on pass/fail for a given commit.
# - No docker image build here yet — the worker image arrives with S3.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-be:
    name: build backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore comuki.slnx

      - name: Build
        run: dotnet build comuki.slnx -c Debug --no-restore

  # Full unit matrix (tests/unit/*/ + tests/Comuki.Architecture.Tests),
  # discovered and run by scripts/ci/dotnet-test.mjs — replaces the old
  # hand-picked 2-project matrix. One job (not a per-project matrix): the
  # script builds the solution once, then runs every project with
  # --no-build, which is cheaper than N runners each restoring + building
  # the project graph from scratch. GitLab's test:unit (deploy/hybrid/ci.yml)
  # calls the same script with the same flags, so both pipelines agree on
  # pass/fail for a given commit.
  test-be:
    name: test backend (unit, full matrix)
    needs: build-be
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # Fresh runner (build-be artifacts do not carry over) -> explicit
      # restore + build, then the script runs every project with --no-build.
      - name: Restore
        run: dotnet restore comuki.slnx

      - name: Build
        run: dotnet build comuki.slnx -c Debug --no-restore

      # xUnit v3 = Microsoft Testing Platform: `dotnet test` cannot discover
      # it, every project runs via `dotnet run --project`. The script parses
      # each project's CTRF report (locale-independent, unlike grepping the
      # human-readable summary lines) and writes report.json/report.md in
      # the shape design.md's "Report format for agents" documents.
      - name: Run unit tests (full matrix)
        run: node scripts/ci/dotnet-test.mjs --tier=unit --full --report-dir artifacts/test-reports/unit

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: artifacts/test-reports/unit

  # Integration suites boot a real Postgres through Testcontainers. They had
  # never run in CI, and that is how a broken anonymous-webhook path and a
  # broken api-key lookup survived unnoticed: every local check for a container
  # runtime asked `docker --version`, found no CLI, and stopped there. The
  # GitHub runner has a Docker daemon, so here they simply work.
  #
  # One job rather than a matrix: each project starts its own container, and
  # twenty-one runners paying that startup separately costs more than it saves.
  test-integration:
    name: test backend (integration)
    needs: build-be
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore comuki.slnx

      - name: Build
        run: dotnet build comuki.slnx -c Debug --no-restore

      # Comuki.Host.Testing is the shared harness library, not a suite — it
      # has no entry point; scripts/ci/dotnet-test.mjs excludes it by name.
      # The script parses each project's CTRF report to tell a fully-skipped
      # suite (0 failed, N total) apart from a broken one (0 tests
      # discovered at all) — no more grepping localized summary lines.
      - name: Run integration suites
        run: node scripts/ci/dotnet-test.mjs --tier=integration --report-dir artifacts/test-reports/integration

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: artifacts/test-reports/integration

  build-fe:
    name: build frontend (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bun.lock is not committed yet -> plain install, no --frozen-lockfile.
      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # `format` writes `**/*.{ts,tsx}`; the check reads the same glob, so a
      # green gate means `bun run format` is a no-op. The kubb-generated tree
      # stays in scope on purpose — `generate-api` chains prettier, so it is
      # clean and checking it keeps it that way. `src/routeTree.gen.ts` is
      # excluded in .prettierignore: the router plugin rewrites it on build.
      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun run test

  # The three TS agent packages (~2.7k lines) were in no job at all — among
  # them comuki-dev-sdk's PreToolUse lock gate, the thing that decides whether
  # an agent's tool call is allowed. A clean checkout has no agents/node_modules,
  # so this installs before it can do anything else.
  build-agents:
    name: build agents (ts sdks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # agents/bun.lock IS committed (agents/.gitignore un-ignores it), so the
      # resolution is pinned and the install must fail rather than drift.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Unit tests
        run: bun test

  # The CLI (issue #84): gates plus the contract drift check. The CLI
  # consumes GENERATED transport contracts — cli/src/contracts/_generated
  # (kubb http types from the backend-emitted OpenAPI doc + the realtime
  # module from tools/Comuki.Codegen.Realtime). The tree is committed; a
  # server contract change without a matching `bun run generate:contracts`
  # must fail here, before merge, not in a user's terminal.
  build-cli:
    name: build cli
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      # test:contracts shells out to `dotnet build ../comuki.slnx` (re-emits
      # artifacts/openapi.json) and `dotnet run` for the realtime codegen —
      # same 10.0.x the backend jobs pin.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # cli/bun.lock is not committed (same as dashboard) — plain install.
      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      # Regenerates both contract artifacts from the server sources and
      # fails on any diff under cli/src/contracts/_generated. Exit != 0
      # means the committed contract tree is stale: run
      # `bun run generate:contracts` from cli/ and commit the result.
      - name: Contract drift gate
        run: bun run test:contracts

# GitLab CI for comuki.orchestrator
#
# Stages: build (BE + FE in parallel), then test.
# Image: mcr.microsoft.com/dotnet/sdk:10.0 — has both .NET 10 SDK and apt
# for bun installation. Single shared image keeps the cache hit-rate
# high (sdk layer is ~600MB but reused for every job).
#
# xUnit v3 uses Microsoft Testing Platform — tests run via 'dotnet run'
# not 'dotnet test' (VSTest doesn't support xUnit v3 discovery).

stages:
  - build
  - test

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  before_script:
    # Bun — for the dashboard pipeline (generate-api, vite build, storybook, tests)
    - apt-get update -qq && apt-get install -y -qq curl unzip
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
    - bun --version
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .nuget/packages/
      - dashboard/node_modules/

build-backend:
  stage: build
  script:
    - dotnet build comuki.slnx -c Release --nologo
    # Sanity: build-time OpenAPI codegen must produce the spec file.
    # (Microsoft.Extensions.ApiDescription.Server runs as a MSBuild target
    #  inside 'dotnet build' — if the spec is missing the codegen step
    #  silently failed.)
    - test -f platform/src/application/api/Comuki.Platform.Api.Public/openapi-v1.json
    - head -c 200 platform/src/application/api/Comuki.Platform.Api.Public/openapi-v1.json
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - platform/src/application/api/Comuki.Platform.Api.Public/openapi-v1.json

build-frontend:
  stage: build
  needs: []  # parallel with build-backend; FE rebuilds the spec itself
  script:
    - cd dashboard
    # install --frozen-lockfile is mandatory in CI — bails if package.json
    # drifted from bun.lock (forces a deliberate regeneration).
    - bun install --frozen-lockfile
    # generate-api = 'dotnet build comuki.slnx && kubb generate' (Phase 2 plan).
    # Re-runs the BE build to refresh openapi-v1.json, then emits
    # 15 TS files into src/api/ via Kubb.
    - bun run generate-api
    - bun run build
    - bun run build-storybook
  artifacts:
    when: always
    expire_in: 1 day
    paths:
      - dashboard/dist/
      - dashboard/storybook-static/
      - dashboard/src/api/

# xUnit v3 tests: each test project is self-executable via 'dotnet run'
# (Microsoft Testing Platform). 'dotnet test' does NOT work with xUnit v3
# (VSTest lacks v3 discovery). NOTE: do NOT pass --nologo to 'dotnet run' —
# it gets forwarded to the MTP runner and makes it print help instead of
# running tests. Binaries aren't carried from build-backend (only the
# OpenAPI spec is an artifact), so build Debug here once, then run each
# project with --no-build.
test-backend:
  stage: test
  needs: [build-backend]
  script:
    - dotnet build comuki.slnx -c Debug --nologo
    - dotnet run --project tests/Comuki.Platform.Architecture.Tests/Comuki.Platform.Architecture.Tests.csproj -c Debug --no-build
    - dotnet run --project tests/Comuki.Platform.Orchestration.Unit.Lease/Comuki.Platform.Orchestration.Unit.Lease.csproj -c Debug --no-build
    - dotnet run --project tests/Comuki.Platform.Routing.Unit.KeyRotation/Comuki.Platform.Routing.Unit.KeyRotation.csproj -c Debug --no-build
    - dotnet run --project tests/Comuki.Platform.Worker.Translator.Unit.StreamJson/Comuki.Platform.Worker.Translator.Unit.StreamJson.csproj -c Debug --no-build
    - dotnet run --project tests/Comuki.Platform.Worker.Translator.Integration.PiCli/Comuki.Platform.Worker.Translator.Integration.PiCli.csproj -c Debug --no-build
    - dotnet run --project tests/Comuki.Platform.Proxy.Integration.Rotation/Comuki.Platform.Proxy.Integration.Rotation.csproj -c Debug --no-build
  coverage: '/Total:\s+(\d+\.\d+)/'

test-frontend:
  stage: test
  needs: [build-frontend]
  script:
    - cd dashboard
    - bun run test:coverage
    - bun run test:e2e
  coverage: '/All files[^|]*\|[^|]*\|[^|]*\|[^|]*\s+([\d.]+)/'

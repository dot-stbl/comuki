# Comuki dashboard nginx: SPA static files + reverse proxy to the
# orchestrator host container.
#
# The host name `comuki-host` resolves through Docker/k8s DNS. nginx
# resolves proxy_pass hostnames once at startup; the resolver +
# variable form below defers resolution to request time so a not-yet-
# healthy backend at boot does not kill the container.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # SPA static files with history fallback (TanStack Router).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Versioned REST API.
    location /api/ {
        set $backend http://comuki-host:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Run artifact uploads + long chat turns.
        client_max_body_size 150m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SignalR realtime hub (WebSockets).
    location /realtime/ {
        set $backend http://comuki-host:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Runtime OpenAPI document (public metadata, handy for tools).
    location /openapi/ {
        set $backend http://comuki-host:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static liveness passthrough (container healthchecks hit the host
    # directly, but having it here simplifies external probes).
    location = /api/v1/health {
        set $backend http://comuki-host:8080;
        proxy_pass $backend;
    }
}

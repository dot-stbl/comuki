apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "comuki.fullname" . }}-config
  labels:
    {{- include "comuki.labels" . | nindent 4 }}
data:
  COMUKI_PUBLIC_HOST_URL: {{ .Values.publicUrl | quote }}
  COMUKI_HOST_CORS_ALLOWEDORIGINS_0: {{ .Values.publicUrl | quote }}
  COMUKI_ARTIFACTS_ENDPOINT: {{ include "comuki.artifactsEndpoint" . | quote }}
  COMUKI_ARTIFACTS_BUCKET: {{ .Values.artifacts.bucket | quote }}
  COMUKI_ARTIFACTS_USESSL: {{ include "comuki.artifactsUseSSL" . | quote }}
  COMUKI_ARTIFACTS_AUTOCREATEBUCKET: "true"
  COMUKI_COMPUTE_PROVIDER: {{ .Values.compute.provider | quote }}
  COMUKI_COMPUTE_SCALE_WORKERIMAGE: {{ .Values.compute.workerImage | quote }}
  COMUKI_COMPUTE_SCALE_ORCHESTRATORGRPCURL: {{ include "comuki.orchestratorGrpcUrl" . | quote }}
  {{- if eq .Values.compute.provider "kubernetes" }}
  COMUKI_COMPUTE_KUBERNETES_NAMESPACE: {{ include "comuki.workerNamespace" . | quote }}
  COMUKI_COMPUTE_KUBERNETES_SERVICEACCOUNT: {{ .Values.compute.kubernetes.serviceAccount | quote }}
  COMUKI_COMPUTE_KUBERNETES_CPUREQUESTMILLIS: {{ .Values.compute.kubernetes.cpuRequestMillis | quote }}
  COMUKI_COMPUTE_KUBERNETES_MEMORYREQUESTMIB: {{ .Values.compute.kubernetes.memoryRequestMiB | quote }}
  {{- end }}
  {{- with .Values.telemetry.otlpEndpoint }}
  COMUKI_TELEMETRY_OTLPENDPOINT: {{ . | quote }}
  {{- end }}

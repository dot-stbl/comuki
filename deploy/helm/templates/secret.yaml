{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "comuki.secretName" . }}
  labels:
    {{- include "comuki.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Key reference for operators using existingSecret instead: the same
  # key names must exist in your Secret.
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  {{- else }}
  {{- fail "secrets.postgresPassword is required when existingSecret is not set (openssl rand -hex 16)" }}
  {{- end }}
  {{- if .Values.secrets.apiKeyPepper }}
  api-key-pepper: {{ .Values.secrets.apiKeyPepper | quote }}
  {{- else }}
  {{- fail "secrets.apiKeyPepper is required when existingSecret is not set (openssl rand -hex 32)" }}
  {{- end }}
  {{- if .Values.secrets.tokenPepper }}
  token-pepper: {{ .Values.secrets.tokenPepper | quote }}
  {{- else }}
  {{- fail "secrets.tokenPepper is required when existingSecret is not set (openssl rand -hex 32)" }}
  {{- end }}
  {{- if .Values.secrets.bootstrapAdminPassword }}
  bootstrap-admin-password: {{ .Values.secrets.bootstrapAdminPassword | quote }}
  {{- else }}
  {{- fail "secrets.bootstrapAdminPassword is required when existingSecret is not set" }}
  {{- end }}
  {{- if or (not .Values.artifacts.external.enabled) .Values.secrets.artifactsAccessKey }}
  {{- if .Values.secrets.artifactsAccessKey }}
  artifacts-access-key: {{ .Values.secrets.artifactsAccessKey | quote }}
  {{- else }}
  {{- fail "secrets.artifactsAccessKey is required with the in-cluster MinIO when existingSecret is not set" }}
  {{- end }}
  {{- end }}
  {{- if or (not .Values.artifacts.external.enabled) .Values.secrets.artifactsSecretKey }}
  {{- if .Values.secrets.artifactsSecretKey }}
  artifacts-secret-key: {{ .Values.secrets.artifactsSecretKey | quote }}
  {{- else }}
  {{- fail "secrets.artifactsSecretKey is required with the in-cluster MinIO when existingSecret is not set" }}
  {{- end }}
  {{- end }}
  {{- with .Values.secrets.brainModelApiKey }}
  brain-model-api-key: {{ . | quote }}
  {{- end }}
{{- end }}

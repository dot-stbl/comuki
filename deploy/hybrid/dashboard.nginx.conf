# Comuki dashboard nginx (hybrid contour): SPA static files + reverse
# proxy to the orchestrator host inside the cluster.
#
# Sibling of deploy/compose/docker/dashboard.nginx.conf (the OSS compose
# variant), adapted for Kubernetes:
#   * upstream is the in-cluster Service FQDN comuki.comuki.svc.cluster.local
#     (ns comuki, releaseName comuki) — nginx's `resolver` does NOT consult
#     resolv.conf search domains, so the short name `comuki` would not
#     resolve; the FQDN is mandatory;
#   * the resolver itself is named (kube-dns service), which nginx resolves
#     once at startup via the pod's own /etc/resolv.conf — no ClusterIP
#     hardcoding;
#   * deferred resolution (resolver + variable) keeps the container alive
#     through backend pod restarts and Service ClusterIP changes.

resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Vite emits content-hashed assets under /assets/. They are immutable
    # per hash: cache hard. Everything else (index.html above all) must
    # revalidate, or a redeploy leaves browsers holding an index.html that
    # references asset files that no longer exist.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Container liveness/readiness + external smoke probe (does not touch
    # the backend — the dashboard's health is "static files served").
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # SPA static files with history fallback (TanStack Router).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Versioned REST API.
    location /api/ {
        set $backend http://comuki.comuki.svc.cluster.local:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Run artifact uploads + long chat turns.
        client_max_body_size 150m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SignalR realtime hub (WebSockets).
    location /realtime/ {
        set $backend http://comuki.comuki.svc.cluster.local:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Runtime OpenAPI document (public metadata, handy for tools).
    location /openapi/ {
        set $backend http://comuki.comuki.svc.cluster.local:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

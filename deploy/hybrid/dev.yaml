# =============================================================================
# comuki dev values for the shared hybrid-service chart (corp dev cluster).
#
# Application: `comuki-dev` is GENERATED by the AppSet hybrid-services-dev
# (discovers this file on GitLab master): ns `comuki`, releaseName `comuki`,
# chart OCI hybrid-service 0.2.1, image.tag = short_sha of master HEAD,
# automated sync + selfHeal. Do not hand-apply an Application.
#
# One image, two entrypoints (console.x pattern): /app/host runs the
# orchestrator (this Deployment), /app/migrator is the batch Job target for
# migrate:dev. The worker image (registry.hybrid.ai/comuki/worker) is NOT a
# Deployment here — workers are ephemeral batch Jobs spawned by the compute
# engine.
#
# Image tag is deliberately absent: the AppSet pins it from the commit.
# =============================================================================

nameOverride: comuki

image:
  repository: registry.hybrid.ai/comuki/comuki

workingDir: /app/host
command: [/app/host/comuki]

# One replica: SignalR + the in-memory worker-token store (Phase 4 Slice 0
# shape). Scaling needs the DB-backed token store first.
replicaCount: 1

service:
  port: 8080

ingress:
  enabled: true
  host: comuki.nova.adcluster.targetix.net
  # Corp dev cluster entry is nginx (not traefik). Annotations copied from
  # the console.x dev release: forwarded headers for the public-host URL
  # building, large body for worker artifact uploads, long timeout for the
  # realtime (SignalR) connections.
  className: nginx-internal
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "150m"
    nginx.ingress.kubernetes.io/proxy-timeout: "600s"

# Verified against Comuki.Host/HostComposer + ApiRoutes:
#   GET /health        — static liveness (anonymous)
#   GET /health/ready  — readiness: Postgres SELECT 1 + proxy-key catalogue
probes:
  liveness: /health
  readiness: /health/ready

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1.5Gi

securityContext:
  pod:
    # APP_UID 1654 is the default `app` user in mcr aspnet:10.0 — matches
    # the chart default, restated here for visibility.
    runAsUser: 1654
    fsGroup: 1654
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# tmpVolume stays enabled (chart default): the host writes nothing outside
# /tmp under a read-only root.

env:
  # Production ON PURPOSE, also on dev: the ProductionSecretValidator gate
  # (MinIO keys, bootstrap admin, both HMAC peppers) must be enforced in the
  # dev contour — a dev boot with default peppers is exactly the mistake the
  # validator exists to catch. Peppers/keys come from the Consul blob via
  # envFrom below (owner step, see deploy/hybrid/README.md).
  ASPNETCORE_ENVIRONMENT: Production

  # Public URL the host stamps into OIDC redirects (AuthPublicHostOptions;
  # COMUKI_PUBLIC_HOST_URL env). DNS must be registered to the ingress IP
  # (owner step; nsupdate pattern per virtual.deploy.dev/docs/dns.md).
  COMUKI_PUBLIC_HOST_URL: http://comuki.nova.adcluster.targetix.net

  # CORS allow-list for the dashboard SPA origin (Host__Cors__AllowedOrigins
  # array binding). The dashboard itself is not deployed in-cluster yet —
  # same-origin first, adjust when the SPA lands on its own host.
  Host__Cors__AllowedOrigins__0: http://comuki.nova.adcluster.targetix.net

  # Artifacts store: SHARED MinIO object-store-01 (owner decision
  # 2026-09-10) — s3.nova.adcluster.targetix.net:9000, plain HTTP.
  # Keys (Artifacts__{Access,Secret}Key) are NOT here — they arrive via
  # envFrom from the Consul blob (owner-provisioned shared-MinIO creds).
  # Bucket comuki-run-bundles is created by the host on first use
  # (Artifacts__AutoCreateBucket).
  Artifacts__Endpoint: s3.nova.adcluster.targetix.net:9000
  Artifacts__UseSSL: "false"
  Artifacts__Bucket: comuki-run-bundles
  Artifacts__AutoCreateBucket: "true"

  # Telemetry: SHARED OTLP collector telemetry-01 (owner decision
  # 2026-09-10) — otlp.nova.adcluster.targetix.net:4317 (gRPC).
  # ComukiTelemetryInstaller adds the OTLP exporter only when this is
  # set; unset = traces/metrics stay local no-ops.
  Telemetry__OtlpEndpoint: http://otlp.nova.adcluster.targetix.net:4317

  # Compute engine: workers as batch/v1 Jobs in this cluster. With an empty
  # Compute:Scale:Projects list the supervisor pass is a no-op, so this is
  # safe to carry before Slice 0 wires projects. Worker-image tag pinning
  # and the worker Job RBAC (create jobs in ns comuki) are Slice 0 follow-ups
  # — see deploy/hybrid/README.md.
  Compute__Provider: kubernetes
  Compute__Scale__WorkerImage: registry.hybrid.ai/comuki/worker
  Compute__Scale__OrchestratorGrpcUrl: http://comuki:8080

# COMUKI_DB (full Npgsql DSN to pgvector.comuki.svc.cluster.local),
# COMUKI_IDENTITY_APIKEY_PEPPER, COMUKI_TOKEN_PEPPER,
# COMUKI_BOOTSTRAP_ADMIN_{EMAIL,PASSWORD}, Artifacts__{Access,Secret}Key —
# names in deploy/hybrid/secrets.schema.yml, values in the Consul blob
# cicd/nova/secrets/dev/comuki (materialized by the secrets:dev CI job).
envFrom:
  secrets: [comuki-dev-host-secrets]

# =============================================================================
# comuki dev values for the shared hybrid-service chart (corp dev cluster).
#
# Application: `comuki-dev` is GENERATED by the AppSet hybrid-services-dev
# (discovers this file on GitLab master): ns `comuki`, releaseName `comuki`,
# chart OCI hybrid-service 0.2.1, image.tag = short_sha of master HEAD,
# automated sync + selfHeal. Do not hand-apply an Application.
#
# One image, two entrypoints (console.x pattern): /app/host runs the
# orchestrator (this Deployment), /app/migrator is the batch Job target for
# migrate:dev. The worker image (registry.hybrid.ai/comuki/worker) is NOT a
# Deployment here — workers are ephemeral batch Jobs spawned by the compute
# engine.
#
# Image tag is deliberately absent: the AppSet pins it from the commit.
# =============================================================================

nameOverride: comuki

image:
  repository: registry.hybrid.ai/comuki/comuki

workingDir: /app/host
command: [/app/host/comuki]

# One replica: SignalR + the in-memory worker-token store (Phase 4 Slice 0
# shape). Scaling needs the DB-backed token store first.
replicaCount: 1

service:
  port: 8080

ingress:
  enabled: true
  host: comuki.nova.adcluster.targetix.net
  # Corp dev cluster entry is nginx (not traefik). Annotations copied from
  # the console.x dev release: forwarded headers for the public-host URL
  # building, large body for worker artifact uploads, long timeout for the
  # realtime (SignalR) connections.
  className: nginx-internal
  annotations:
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "150m"
    nginx.ingress.kubernetes.io/proxy-timeout: "600s"

# Verified against Comuki.Host/HostComposer + ApiRoutes:
#   GET /api/v1/health        — static liveness (anonymous)
#   GET /api/v1/health/ready  — readiness: Postgres SELECT 1 + proxy-key catalogue
probes:
  liveness: /api/v1/health
  readiness: /api/v1/health/ready

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1.5Gi

securityContext:
  pod:
    # APP_UID 1654 is the default `app` user in mcr aspnet:10.0 — matches
    # the chart default, restated here for visibility.
    runAsUser: 1654
    fsGroup: 1654
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# tmpVolume stays enabled (chart default): the host writes nothing outside
# /tmp under a read-only root.

# Vega cluster kubeconfig: mounted read-only, the compute engine reads it
# to spawn worker Jobs on the vega cluster instead of in-cluster.
volumeMounts:
  - name: vega-kubeconfig
    mountPath: /vega
    readOnly: true

volumes:
  - name: vega-kubeconfig
    secret:
      secretName: comuki-vega-kubeconfig

env:
  # Production ON PURPOSE, also on dev: the ProductionSecretValidator gate
  # (MinIO keys, bootstrap admin, both HMAC peppers) must be enforced in the
  # dev contour — a dev boot with default peppers is exactly the mistake the
  # validator exists to catch. Peppers/keys come from the Consul blob via
  # envFrom below (owner step, see deploy/hybrid/README.md).
  ASPNETCORE_ENVIRONMENT: Production

  # Public URL the host stamps into OIDC redirects (AuthPublicHostOptions;
  # COMUKI_PUBLIC_HOST_URL env). DNS must be registered to the ingress IP
  # (owner step; nsupdate pattern per virtual.deploy.dev/docs/dns.md).
  COMUKI_PUBLIC_HOST_URL: http://comuki.nova.adcluster.targetix.net

  # CORS allow-list (COMUKI_HOST_CORS_ALLOWEDORIGINS_0 → Host:Cors:AllowedOrigins:0).
  # SPA is same-origin; kept for cross-origin tooling against the API.
  COMUKI_HOST_CORS_ALLOWEDORIGINS_0: http://comuki.nova.adcluster.targetix.net

  # OIDC login (Keycloak in ns comuki): auth:oidc:providers[0] via the
  # COMUKI_ env face (COMUKI_AUTH_OIDC_PROVIDERS_0_* → auth:oidc:providers:0:*).
  # The client secret is NOT here — ClientSecretEnv names the env var that
  # holds it (COMUKI_OIDC_KEYCLOAK_SECRET, Consul blob via envFrom below).
  # Callback the IdP must be registered with is the UNIFIED
  # /api/v1/auth/oidc/callback (RedirectUriBuilder; no provider segment).
  # RequireHTTPS=false — dev contour is plain HTTP, never copy to prod.
  COMUKI_AUTH_OIDC_PROVIDERS_0_NAME: keycloak
  COMUKI_AUTH_OIDC_PROVIDERS_0_AUTHORITY: http://keycloak.comuki.nova.adcluster.targetix.net/realms/comuki
  COMUKI_AUTH_OIDC_PROVIDERS_0_CLIENTID: comuki
  COMUKI_AUTH_OIDC_PROVIDERS_0_CLIENTSECRETENV: COMUKI_OIDC_KEYCLOAK_SECRET
  COMUKI_AUTH_OIDC_PROVIDERS_0_REQUIREHTTPS: "false"

  # Artifacts store: SHARED MinIO object-store-01 —
  # s3.nova.adcluster.targetix.net:9000, plain HTTP.
  # Keys COMUKI_ARTIFACTS_{ACCESS,SECRET}KEY arrive via envFrom (Consul blob).
  COMUKI_ARTIFACTS_ENDPOINT: s3.nova.adcluster.targetix.net:9000
  COMUKI_ARTIFACTS_USESSL: "false"
  COMUKI_ARTIFACTS_BUCKET: comuki-run-bundles
  COMUKI_ARTIFACTS_AUTOCREATEBUCKET: "true"

  # Telemetry: SHARED OTLP collector telemetry-01 —
  # otlp.nova.adcluster.targetix.net:4317 (gRPC).
  COMUKI_TELEMETRY_OTLPENDPOINT: http://otlp.nova.adcluster.targetix.net:4317

  # Compute: workers as batch/v1 Jobs. Empty Compute:Scale:Projects →
  # supervisor no-op until Slice 0 wires projects.
  COMUKI_COMPUTE_PROVIDER: kubernetes

  # Brain host (gRPC sibling Deployment, infra-dev.yaml). Without this key
  # the chat graph falls back to the in-process BrainStub (echo).
  COMUKI_BRAIN_ENDPOINT: http://comuki-brain:17004
  COMUKI_COMPUTE_SCALE_WORKERIMAGE: registry.hybrid.ai/comuki/worker
  COMUKI_COMPUTE_SCALE_ORCHESTRATORGRPCURL: http://comuki:8080
  COMUKI_COMPUTE_KUBERNETES_NAMESPACE: comuki
  COMUKI_COMPUTE_KUBERNETES_SERVICEACCOUNT: comuki-worker
  # Workers go to the vega cluster (external kubeconfig, mounted secret)
  COMUKI_COMPUTE_KUBERNETES_KUBECONFIGPATH: /vega/kubeconfig

  # Editions dev license (non-prod overlay): long-lived team-tier token
  # that lifts the Community 1-project cap on dev. Signed by the
  # dedicated "dev overlay" Ed25519 key — the payload carries
  # audience=dev, so the token verifies ONLY against DevPublicKey below
  # and never against the production key; production contours leave
  # DevPublicKey unset, so a leaked copy of this token cannot unlock
  # anything but dev/stage. Only the verifying (public) half of the key
  # lives in this repo — the private half is owner-held (re-mint after
  # the 2036 expiry via tools/Comuki.License.Mint `sign --audience dev`).
  COMUKI_HOST_LICENSE_PATH: env:COMUKI_EDITION_LICENSE
  COMUKI_EDITION_LICENSE: eyJvcmciOiJkZXYtb3ZlcmxheSIsImVkaXRpb24iOiJ0ZWFtIiwic2VhdHMiOm51bGwsIm5vdEJlZm9yZSI6bnVsbCwiZXhwaXJ5IjoiMjAzNi0wOS0yNVQwMDowMDowMCswMDowMCIsIm1vZGUiOiJpbXBsaWNpdC1ieS1yYW5rIiwiYXVkaWVuY2UiOiJkZXYiLCJmZWF0dXJlcyI6bnVsbCwibGltaXRzIjpudWxsfQ.qVBi3H-3Yxr-mBWNOSRBmKWwxRc2Zwf4FUF81ZlOp4Yzj_SSfHV1rCU46r1T1YeoGJqJq_O_rYsJn7S7mGm2Dw
  COMUKI_HOST_LICENSE_DEVPUBLICKEY: VroK2oxeIXJWJG6lArhpMnRAkoyeTsdngT2jEdDEct4=

# COMUKI_DB (full Npgsql DSN to pgvector.comuki.svc.cluster.local),
# COMUKI_IDENTITY_APIKEY_PEPPER, COMUKI_TOKEN_PEPPER,
# COMUKI_BOOTSTRAP_ADMIN_{EMAIL,PASSWORD}, COMUKI_ARTIFACTS_{ACCESS,SECRET}KEY,
# COMUKI_OIDC_KEYCLOAK_SECRET (Keycloak client secret for the OIDC flow) —
# names in deploy/hybrid/secrets.schema.yml, values in the Consul blob
# cicd/nova/secrets/dev/comuki (materialized by the secrets:dev CI job).
envFrom:
  secrets: [comuki-dev-host-secrets]

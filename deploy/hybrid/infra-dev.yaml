# =============================================================================
# deploy/hybrid/infra-dev.yaml — in-cluster dev storage for comuki.
#
# Applied manually by the `infra:dev` CI job (KUBECONFIG_B64 + server
# verification, same contract as secrets:dev). Idempotent — safe to re-run.
#
# Lives in ns `comuki` (created by the AppSet with the pull-secret label;
# the Namespace below carries the same labels so this manifest also works
# if applied BEFORE the AppSet's first sync).
#
# NOT for prod: single replica each, latest MinIO tag, root credentials.
# =============================================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: comuki
  labels:
    # Triggers the ESO ClusterExternalSecret that projects the
    # registry.hybrid.ai dockerconfig pull secret into this ns.
    hybrid.contour/pull-secret: corp
    app.kubernetes.io/part-of: hybrid-contour

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: comuki
  labels:
    app.kubernetes.io/name: pgvector
    app.kubernetes.io/part-of: comuki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pgvector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgvector
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: comuki-pgvector-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comuki-pgvector-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: comuki
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, comuki, -d, comuki]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: [pg_isready, -U, comuki, -d, comuki]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pgvector-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgvector-data
  namespace: comuki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: pgvector
  namespace: comuki
  labels:
    app.kubernetes.io/name: pgvector
spec:
  selector:
    app.kubernetes.io/name: pgvector
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: comuki
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: comuki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
    spec:
      containers:
        - name: minio
          # TODO(pin): pin a RELEASE tag once dev storage survives its first
          # rebuild cycle; `latest` is mutable and acceptable for dev only.
          image: minio/minio:latest
          command: [server, /data, --console-address, ":9001"]
          ports:
            - containerPort: 9000
              name: s3
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: comuki-minio-credentials
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comuki-minio-credentials
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: comuki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: comuki
  labels:
    app.kubernetes.io/name: minio
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console

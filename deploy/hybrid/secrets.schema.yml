# =============================================================================
# deploy/hybrid/secrets.schema.yml — Consul blob → Kubernetes Secrets
# for the secrets:dev CI job (cicd.modules .secrets:materialize).
#
# NAMES ONLY: this file is the schema of the Consul blob
#   cicd/nova/secrets/dev/comuki
# The VALUES are an owner step (Consul UI / platform task) — see
# deploy/hybrid/README.md. The materialize job refuses to run until every
# key below exists and is non-empty in the blob.
#
# Secret names MUST match envFrom in deploy/hybrid/dev.yaml. apply replaces
# `data` wholesale: a key missing here disappears from the cluster secret.
#
# Sync requirements (owner keeps these consistent in the blob):
#   - the password inside COMUKI_DB must equal POSTGRES_PASSWORD
#     (comuki-pgvector-credentials provisions the same database);
#   - MINIO_ROOT_{USER,PASSWORD} are the SHARED object-store-01 MinIO
#     credentials for comuki (s3.nova.adcluster.targetix.net:9000;
#     dedicated access-key pair, owner-provisioned — not the MinIO root
#     of a comuki-owned deployment); the host reads them as
#     Artifacts__{Access,Secret}Key.
# =============================================================================

consul_prefix: "cicd/nova/secrets/{env}/comuki"

environments:
  dev:
    namespace: comuki
    secrets:
      # Everything the orchestrator host (and the migrate Job, via envFrom)
      # reads. Full DSN — Host=pgvector.comuki.svc.cluster.local;Port=5432;
      # Database=comuki;Username=comuki;Password=<POSTGRES_PASSWORD>.
      # Peppers: Production validator refuses boot on dev defaults —
      # high-entropy random values, one per environment (rotating a pepper
      # invalidates every issued API key / worker token).
      # Bootstrap admin password: >= 12 chars, at least one digit and one
      # non-alphanumeric character (ProductionSecretValidator).
      - name: comuki-dev-host-secrets
        keys:
          COMUKI_DB: COMUKI_DB
          COMUKI_IDENTITY_APIKEY_PEPPER: COMUKI_IDENTITY_APIKEY_PEPPER
          COMUKI_TOKEN_PEPPER: COMUKI_TOKEN_PEPPER
          COMUKI_BOOTSTRAP_ADMIN_EMAIL: COMUKI_BOOTSTRAP_ADMIN_EMAIL
          COMUKI_BOOTSTRAP_ADMIN_PASSWORD: COMUKI_BOOTSTRAP_ADMIN_PASSWORD
          Artifacts__AccessKey: MINIO_ROOT_USER
          Artifacts__SecretKey: MINIO_ROOT_PASSWORD
          COMUKI_BRAIN_MODEL_API_KEY: COMUKI_BRAIN_MODEL_API_KEY
          COMUKI_BRAIN_MODEL_ENDPOINT: COMUKI_BRAIN_MODEL_ENDPOINT
          COMUKI_BRAIN_MODEL_ID: COMUKI_BRAIN_MODEL_ID

      # In-cluster pgvector (deploy/hybrid/infra-dev.yaml). POSTGRES_USER
      # should match the Username inside COMUKI_DB (comuki).
      - name: comuki-pgvector-credentials
        keys:
          POSTGRES_USER: POSTGRES_USER
          POSTGRES_PASSWORD: POSTGRES_PASSWORD

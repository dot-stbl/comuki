# Dashboard: the SPA image + nginx, proxying /api, /realtime and
# /openapi to the host service. One origin — no CORS in the browser.
#
# The SPA image is BAKED with VITE_API_BASE_URL at build time (see
# deploy/compose/docker/dashboard.Dockerfile). Build it with the public
# URL of THIS deployment and push to your registry, or reuse a
# published ghcr.io/dot-stbl/comuki-dashboard tag built for the same
# URL.
apiVersion: v1
kind: ConfigMap
metadata:
  name: comuki-dashboard-nginx
  namespace: comuki
  labels:
    app.kubernetes.io/name: comuki
    app.kubernetes.io/component: dashboard
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://comuki:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            client_max_body_size 150m;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /realtime/ {
            proxy_pass http://comuki:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /openapi/ {
            proxy_pass http://comuki:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://comuki:80;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comuki-dashboard
  namespace: comuki
  labels:
    app.kubernetes.io/name: comuki
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comuki
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comuki
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/dot-stbl/comuki-dashboard:latest
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: comuki-dashboard-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: comuki-dashboard
  namespace: comuki
  labels:
    app.kubernetes.io/name: comuki
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
  selector:
    app.kubernetes.io/name: comuki
    app.kubernetes.io/component: dashboard

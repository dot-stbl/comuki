# Comuki secrets — TEMPLATE.
#
# 1. Copy:  cp secret.example.yaml secret.yaml
# 2. Replace every ${PLACEHOLDER} with a real value:
#      openssl rand -hex 32   # peppers
#      openssl rand -hex 16   # passwords / MinIO keys
# 3. Apply ONLY your local copy (secret.yaml is gitignored):
#      kubectl apply -f secret.yaml
# 4. Delete secret.yaml afterwards, or keep it in a secret manager.
#
# NEVER commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: comuki-secrets
  namespace: comuki
  labels:
    app.kubernetes.io/name: comuki
type: Opaque
stringData:
  # Postgres password for the comuki user.
  postgres-password: "${COMUKI_POSTGRES_PASSWORD}"
  # HMAC pepper for stored API keys (rotating invalidates all keys).
  api-key-pepper: "${COMUKI_API_KEY_PEPPER}"
  # HMAC pepper for stored worker tokens (rotating invalidates all tokens).
  token-pepper: "${COMUKI_TOKEN_PEPPER}"
  # Bootstrap admin password — >= 12 chars, digit + symbol in Production.
  bootstrap-admin-password: "${COMUKI_BOOTSTRAP_ADMIN_PASSWORD}"
  # MinIO credentials (also the artifact store keys).
  artifacts-access-key: "${COMUKI_ARTIFACTS_ACCESS_KEY}"
  artifacts-secret-key: "${COMUKI_ARTIFACTS_SECRET_KEY}"
  # Optional: leading-model API key for the standalone brain host.
  # brain-model-api-key: "${COMUKI_BRAIN_MODEL_API_KEY}"

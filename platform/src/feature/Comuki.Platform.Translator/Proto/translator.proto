syntax = "proto3";

package comuki.platform.translator.v1;

option csharp_namespace = "Comuki.Platform.Translator.Proto";

// gRPC contract for Translator ↔ Orchestrator.
// Full implementation (server in Translator, client in Orchestrator) lands in 04-04.
// This stub locks the package name and the bidi stream shape so both sides
// can compile against the same contract from 04-03 onwards.

service Translator {
  // Bidirectional stream: Translator pushes StageActivity/StageReport events
  // as pi emits them; Orchestrator can interleave Stop/Cancel commands.
  rpc Connect(stream TranslatorEvent) returns (stream OrchestratorCommand);
}

message TranslatorEvent {
  oneof payload {
    StageStart stage_start = 1;
    StageActivity stage_activity = 2;
    StageReport stage_report = 3;
  }
}

message StageStart {
  string task_id = 1;
  string stage_id = 2;
  string brief = 3;
}

message StageActivity {
  string task_id = 1;
  string stage_id = 2;
  // text | tool_use | tool_result — discriminated by presence of the next field
  string text = 3;
  string tool = 4;
  string tool_input_json = 5;
}

message StageReport {
  string task_id = 1;
  string stage_id = 2;
  // "success" | "failed" | "cancelled"
  string status = 3;
  int64 duration_ms = 4;
  string result_text = 5;
  string error_text = 6;
}

message OrchestratorCommand {
  oneof payload {
    Stop stop = 1;
  }
}

message Stop {
  string reason = 1;
}

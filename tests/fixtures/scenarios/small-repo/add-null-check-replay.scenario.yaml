# WS8 T2b replay-mode worked example (openspec/changes/add-agentic-test-contour,
# design.md D3 / tasks.md WS8). Same ticket/fixture as
# add-null-check-real-pi.scenario.yaml (T2b WS7) and add-null-check.scenario.yaml
# (T2a WS6) — the trivial null-guard in OrderTotal.Calculate. Replay mode means
# real pi talks to a cassette-backed CassetteModelServer in Replay mode, not to
# FakeModelServer with a fakeScript, so this scenario points at the committed
# cassette produced by CassetteGeneratorShould.GenerateAddNullCheckCassette
# (tests/integration/Comuki.EndToEnd.AgentLoop/RealPi/CassetteGeneratorShould.cs).
# Two turns, identical to add-null-check.fake.json's script, so the WS7
# trajectory assertions (edit tool_use + end_turn follow-up) still hold.
schemaVersion: 1
name: add-null-check-replay
description: >
  Ticket asks for a null guard on OrderTotal.Calculate in the small-repo
  fixture target repo. WS8 replay-mode worked example: the real pi binary
  runs against a committed cassette served by CassetteModelServer in Replay
  mode (no live network, no scripted fake), proves the recorded
  fake-script → real-pi → real-edit loop round-trips against the same
  fixture. Re-running this fact requires no network access whatsoever —
  the cassette server never calls out (design.md D5).
ticket:
  source: github
  title: "NullReferenceException in OrderTotal.Calculate"
  body: |
    Calculate() throws when orders is null. Add a guard and a test.
  labels: [bug, comuki]
  targetRepo:
    fixture: small-repo
    ref: main
worker:
  # Same label as add-null-check-real-pi.scenario.yaml — the shared
  # RealPiFakeModelHost (Intake:Worker:Image config) only carries one
  # image label, and both WS7's fake-mode fact and WS8's replay-mode
  # fact land here. The queue claim SQL's `image = @image` filter matches
  # whichever scenario the in-flight translator loop is targeting, and
  # because RealPiFakeModelCollection disables parallelization each fact
  # runs alone against the queue — the only queued item at run time is
  # the one the running fact just seeded.
  image: comuki-agent-test-worker:ws7-real-pi
  profileKey: implement
  profilesRef: test
model:
  mode: replay
  cassette: cassettes/add-null-check.v1.json
expectedTrajectory:
  # Identical to add-null-check-real-pi.scenario.yaml — the recorded
  # cassette's first turn scripts an "edit" tool_use against OrderTotal.cs,
  # the follow-up turn returns end_turn with no further tool calls. The
  # cassette fixture (regenerated by CassetteGeneratorShould, see header
  # comment) is recorded from the exact two-turn exchange
  # add-null-check.fake.json scripts, so WS7's toolUsed/forbiddenTools
  # assertion holds here too without rewriting it.
  - stage: work-item
    toolsUsed: [edit]
    forbiddenTools: [WebFetch]
assertions:
  journal:
    - condition: WorkspacePrepared
      expected: true
    - condition: AgentRunning
      expected: true
  run:
    finalStatus: succeeded
  diff:
    filesChanged:
      - path: "src/OrderTotal.cs"
        mustContain: "ArgumentNullException"

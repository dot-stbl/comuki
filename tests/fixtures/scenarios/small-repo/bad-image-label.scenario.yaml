# WS6 negative-path worked example — the acceptance criterion from
# openspec/changes/add-agentic-test-contour/tasks.md WS6: "a deliberately-
# broken fixture (bad image label) fails with a report that names the
# failing assertion, not a stack trace dump." worker.image below is never
# built by WorkerTestImage — Comuki.Engine.Compute.Docker's real StartAsync
# call fails with a real "no such image" error from Podman, and the runner
# turns that into a named ScenarioResult failure (stage: compute.start)
# instead of an unhandled exception.
schemaVersion: 1
name: bad-image-label
description: >
  Same ticket as add-null-check, but worker.image names a tag that was
  never built. Proves the runner reports a clean, named failure (not a
  stack trace) when the compute provider cannot start the container.
ticket:
  source: github
  title: "NullReferenceException in OrderTotal.Calculate"
  body: |
    Calculate() throws when orders is null. Add a guard and a test.
  labels: [bug, comuki]
  targetRepo:
    fixture: small-repo
    ref: main
worker:
  image: comuki-agent-test-worker:ws6-nonexistent-tag
  profileKey: implement
  profilesRef: test
model:
  mode: fake
assertions:
  journal:
    - condition: WorkspacePrepared
      expected: true
    - condition: AgentRunning
      expected: true
  run:
    finalStatus: succeeded
